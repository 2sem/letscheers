# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "Build & Test"

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.swift'
      - '.mise.toml'
      - 'Tuist/Package.resolved'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.swift'
      - '.mise.toml'
      - 'Tuist/Package.resolved'
      - '.github/workflows/build-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: xcode-27
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: write
      contents: write

      # required for Tuist OIDC authentication
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Mise
      uses: jdx/mise-action@v5

    - name: Cache Tuist dependencies
      id: deps-cache
      uses: actions/cache@v6
      with:
        path: |
          Tuist/.build
          ~/.cache/swifterpm
        # Shared by CI and CD: pinned by Package.resolved, safe to reuse. Bump the prefix when the path list changes.
        key: tuist-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tuist/Package.resolved', '.mise.toml') }}

    - name: Cache Tuist local cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/tuist
        # CI only: prebuilt binaries are deliberately not restored in release (CD) builds.
        key: tuist-local-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tuist/Package.resolved', '.mise.toml') }}

    - name: Log in Tuist
      run: |
        tuist auth login

    - name: Install Dependencies
      run: |
        tuist install

    # Only worth the round-trip when the dependency cache hit; a cold run builds from sources.
    - name: Setup Tuist Cache Service
      if: steps.deps-cache.outputs.cache-hit == 'true'
      run: |
        tuist setup cache

    - name: Test App
      env:
        SCHEME: App
        TUIST_TEST_BINARY_CACHE: ${{ steps.deps-cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
      run: |
        tuist test
